# System Configuration for 64K Connections
# Place in /etc/sysctl.d/99-tgen-64k.conf
# Apply with: sudo sysctl -p /etc/sysctl.d/99-tgen-64k.conf

# ============================================
# File Descriptor Limits
# ============================================
# System-wide file descriptor limit
fs.file-max = 10000000

# Also set in /etc/security/limits.conf:
# * soft nofile 100000
# * hard nofile 100000

# ============================================
# Network Core Settings
# ============================================

# Maximum number of connections waiting to be accepted
net.core.somaxconn = 65535

# Maximum number of packets queued on the INPUT side
net.core.netdev_max_backlog = 65535

# Maximum socket receive buffer (16MB)
net.core.rmem_max = 16777216

# Maximum socket send buffer (16MB)
net.core.wmem_max = 16777216

# Default socket receive buffer
net.core.rmem_default = 262144

# Default socket send buffer
net.core.wmem_default = 262144

# ============================================
# TCP Settings
# ============================================

# Maximum number of SYN backlog
net.ipv4.tcp_max_syn_backlog = 65535

# TCP socket buffer sizes (min, default, max)
# Format: min default max
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# Enable TCP window scaling for high-bandwidth networks
net.ipv4.tcp_window_scaling = 1

# Enable TCP timestamps (helps with high-speed networks)
net.ipv4.tcp_timestamps = 1

# Enable selective acknowledgments
net.ipv4.tcp_sack = 1

# ============================================
# Connection Reuse and Timeout Settings
# ============================================

# Allow reuse of TIME_WAIT sockets for new connections
# CRITICAL for high connection rates
net.ipv4.tcp_tw_reuse = 1

# Reduce FIN_WAIT_2 timeout (default 60s)
net.ipv4.tcp_fin_timeout = 15

# Reduce keepalive time (default 7200s)
net.ipv4.tcp_keepalive_time = 600

# Keepalive probe interval
net.ipv4.tcp_keepalive_intvl = 10

# Number of keepalive probes
net.ipv4.tcp_keepalive_probes = 5

# ============================================
# Ephemeral Port Range
# ============================================

# Expand ephemeral port range to maximum
# Provides ~64K ports per IP address
net.ipv4.ip_local_port_range = 1024 65535

# ============================================
# Connection Tracking (if using iptables/netfilter)
# ============================================

# Maximum number of connections to track
# Increased to 2M to handle high connection rates without drops
net.netfilter.nf_conntrack_max = 2000000
net.nf_conntrack_max = 2000000

# Connection tracking hash table size
# Should be nf_conntrack_max / 4
net.netfilter.nf_conntrack_buckets = 500000

# Timeout for established connections (default 432000s = 5 days)
net.netfilter.nf_conntrack_tcp_timeout_established = 3600

# Timeout for TIME_WAIT state
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30

# ============================================
# Memory and Buffer Settings
# ============================================

# Maximum amount of memory for TCP (auto-tuned by default)
# Uncomment if you need to set explicitly
# net.ipv4.tcp_mem = 8388608 12582912 16777216

# Maximum number of orphaned sockets
net.ipv4.tcp_max_orphans = 65536

# ============================================
# Performance Tuning
# ============================================

# Disable slow start after idle
net.ipv4.tcp_slow_start_after_idle = 0

# Enable TCP Fast Open (TFO)
net.ipv4.tcp_fastopen = 3

# Congestion control algorithm (cubic is default, bbr is better for high-speed)
# Uncomment to use BBR (requires kernel 4.9+)
# net.core.default_qdisc = fq
# net.ipv4.tcp_congestion_control = bbr

# ============================================
# Security Settings (adjust as needed)
# ============================================

# Protect against SYN flood attacks
net.ipv4.tcp_syncookies = 1

# Disable ICMP redirect acceptance
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0

# Enable reverse path filtering
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# ============================================
# IPv6 Settings (if using IPv6)
# ============================================

# IPv6 ephemeral port range
net.ipv6.ip_local_port_range = 1024 65535

# IPv6 connection tracking
net.netfilter.nf_conntrack_tcp6_timeout_established = 3600

