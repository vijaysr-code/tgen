# /etc/sysctl.d/99-tgen.conf
# Traffic Generator — recommended host kernel parameters
#
# Apply immediately (without reboot):
#   sudo cp 99-tgen.conf /etc/sysctl.d/
#   sudo sysctl -p /etc/sysctl.d/99-tgen.conf
#
# These are HOST-SCOPED parameters that cannot be set inside a container.
# Namespaced per-container sysctls are set in docker-compose.yml instead.

# ── TCP connection handling ────────────────────────────────────────────────

# Enable TCP timestamps — required for tcp_tw_reuse to work on Linux >= 4.12.
net.ipv4.tcp_timestamps = 1

# Allow reuse of TIME_WAIT sockets for new outgoing connections.
# Critical when the client opens many short-lived connections rapidly.
# NOTE: requires net.ipv4.tcp_timestamps = 1 (set above).
net.ipv4.tcp_tw_reuse = 1

# Shorten FIN_WAIT2 linger time (seconds) to free ports faster.
net.ipv4.tcp_fin_timeout = 15

# Increase the SYN backlog queue to handle connection bursts.
net.ipv4.tcp_max_syn_backlog = 4096

# Increase the kernel accept() queue depth for the server.
net.core.somaxconn = 4096

# ── Socket buffer sizes ────────────────────────────────────────────────────
# Required for high-throughput file transfers (-F flag) and high-PPS UDP.
# These are host-scoped and must be set here (not in docker-compose sysctls).

# Maximum socket receive/send buffer ceiling (25 MiB)
net.core.rmem_max = 26214400
net.core.wmem_max = 26214400

# Default socket receive/send buffer (1 MiB).
# Setting default == max would allocate 25 MiB per socket upfront; 1 MiB is
# a practical default that the kernel auto-tunes up to rmem_max as needed.
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576

# TCP-specific buffer tuning: min / default / max (bytes)
net.ipv4.tcp_rmem = 4096 87380 26214400
net.ipv4.tcp_wmem = 4096 65536 26214400

# ── File descriptor limits ─────────────────────────────────────────────────
# Each open connection consumes one file descriptor.
# Raise the system-wide limit for high --total / high --rate runs.
# Also set per-process limit in shell before running:
#   ulimit -n 1000000
fs.file-max = 1000000

